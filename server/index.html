<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="遥控">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f1115'/><text y='72' x='50' font-size='60' text-anchor='middle'>🕹️</text></svg>">
<title>mini 遥控</title>
<style>
  /* ── 画布：390×848（设计稿坐标就是 CSS px）。整体按视口等比缩放。── */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --sat: env(safe-area-inset-top);
    --bg:#0f1115; --card:#191c22; --btn:#252a33; --btn2:#2f3542;
    --line:#2a2f38; --fg:#e8ebf0; --dim:#8b93a1;
    --accent:#3e74d1; --danger:#ff5c5c; --ok:#3ddc84;
  }
  /* html 也铺底色：主屏模式下视口只有 812，物理屏 874，
     底下那 62px 由系统按 html 背景色填充 —— 让它和页面同色，看起来就连成一片了。 */
  html { background:var(--bg); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    overscroll-behavior:none; touch-action:manipulation;
    font-family:-apple-system,system-ui,"PingFang SC",sans-serif; }
  /* 安全区容器：主屏（standalone）下 iOS 状态栏是半透明覆盖层，
   不垫开就会压住输入框。env() 只交给 CSS，JS 不读它——这样 Safari/Chrome 都不会算错。 */
  #safe { position:fixed; left:0; top:0; right:0; bottom:0; overflow:hidden;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  #stage { position:absolute; left:0; top:0; width:390px; height:848px; transform-origin:0 0;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

  button { background:var(--btn); color:var(--fg); border:1px solid var(--line); border-radius:10px;
    font-family:inherit; font-size:15px; font-weight:500; padding:0; user-select:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  button:active { background:var(--btn2); transform:scale(.97); }
  button.pri { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ── 连接状态 / 测试连接 / 输入框 ── */
  #status { position:absolute; left:13px; top:46px; width:62px; height:14px;
    font-size:11px; line-height:14px; color:var(--dim); white-space:nowrap; }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--danger); }
  #ping { position:absolute; left:13px; top:70px; width:61px; height:27px; font-size:11px; }

  #ta { position:absolute; left:82px; top:13px; width:292px; height:98px; resize:none;
    background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px;
    padding:12px; font-family:inherit; font-size:17px; line-height:1.4; }

  /* ── 屏幕镜像区（原对话区）364×236，按 Mac 真实比例 1512:982 ── */
  #mirror { position:absolute; left:13px; top:119px; width:364px; height:236px;
    background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  #mirror.dead::after { content:'取不到画面：检查 token 或 PhoneRemote 的屏幕录制授权';
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#8b93a1; font-size:12px; text-align:center; padding:16px; }
  #scr { display:block; width:100%; height:100%; object-fit:contain; }
  /* 光标：本地合成、60fps 跟手。它是「屏幕内容」，必须浮在镜像上，不属于被禁的悬浮按钮。 */
  /* 光标：和放大镜圆心那个白圈用同一套尺寸/颜色（11px、1.5px 白边、1px 黑描边），
     这样"没放大"和"放大中"看到的是同一个指针，不会有大小跳变。 */
  #cursor { position:absolute; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; pointer-events:none;
    border-radius:50%; border:1.5px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.8);
    transition:opacity .15s; opacity:0; }
  #cursor.show { opacity:1; }
  #cursor.hidden { opacity:0; }
  /* 放大镜：不再是跟随指针的圆，而是**固定在动作行+⌘行位置的矩形临时面板**。
     触摸时出现、抬手即消失；这样不挡触控区、不跟轻点抢手势，而且宽幅比圆形更容易读整行文字。 */
  #mag { position:absolute; left:13px; top:365px; width:364px; height:91px; z-index:12;
    border:1px solid var(--accent); border-radius:10px; overflow:hidden;
    background-color:#000; background-repeat:no-repeat; background-position:center;
    background-size:364px 91px;
    display:none; pointer-events:none;
    box-shadow:0 12px 32px rgba(0,0,0,.8), 0 0 0 4px rgba(62,116,209,.18); }
  /* 放大画面里的小黄点 = 指针在放大区里的真实位置（贴边走时能看出偏了多少） */
  #magDot { position:absolute; width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
    border-radius:50%; background:rgba(255,208,64,.75);
    border:1.5px solid rgba(255,255,255,.9); box-shadow:0 0 6px rgba(255,208,64,.8);
    display:none; }

  /* ── 动作行 y=365 ── */
  #actions { position:absolute; left:15px; top:365px; width:361px; height:38px; }
  #actions button { position:absolute; top:0; height:38px; }
  #aClear { left:0;    width:62px; font-size:13px; }
  #aBksp  { left:73px; width:62px; font-size:17px; }
  /* 用 #actions button#voice 提高优先级：否则被上面 `#actions button{height:38px}` 压成 27×38 的椭圆 */
  #actions button#voice { left:155px; width:27px; height:27px; top:5.5px; border-radius:50%;
            background:#e03131; border-color:#e03131; padding:0; box-sizing:border-box; }
  #voice.ready   { background:var(--accent); border-color:var(--accent); box-shadow:0 0 12px rgba(76,141,255,.6); }
  #voice.playing { background:#fff; border-color:#fff; }
  /* 等待回复语音：红点外面一圈脉冲，表示"这条走手机，等它开口" */
  #voice.armed { box-shadow:0 0 0 3px rgba(62,116,209,.55); animation:armedPulse 1.6s ease-in-out infinite; }
  @keyframes armedPulse { 0%,100%{ box-shadow:0 0 0 3px rgba(62,116,209,.55);} 50%{ box-shadow:0 0 0 7px rgba(62,116,209,.12);} }
  #aSendE { left:196px; width:78px; font-size:14px; }
  #aSend  { left:284px; width:77px; font-size:14px; }

  /* ── ⌘ 一排 y=413，四键各 85 ── */
  #cmdrow { position:absolute; left:13px; top:413px; width:364px; height:45px; }
  #cmdrow button { position:absolute; top:0; width:85px; height:45px; font-size:16px; }
  #cmdrow button:nth-child(1) { left:0; }
  #cmdrow button:nth-child(2) { left:92px; }
  #cmdrow button:nth-child(3) { left:185px; }
  #cmdrow button:nth-child(4) { left:278px; }
  #cmdrow button.holding { background:var(--accent); border-color:var(--accent); }

  /* ── 触控区 361×308，上沿精确对齐 ⌘ 行下沿（466）── */
  #pad { position:absolute; left:14px; top:466px; width:361px; height:308px;
    background:#252a33; border:1px solid var(--line); border-radius:12px; overflow:hidden;
    touch-action:none; }
  /* 圆点颗粒纹理（设计里那片点阵）：CSS 平铺，不用图 */
  #pad .dots { position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(circle, rgba(232,235,240,.20) 1px, transparent 1.2px);
    background-size:13px 13px; background-position:6px 6px; }
  #padHint { position:absolute; left:0; right:0; bottom:8px; text-align:center;
    font-size:10px; color:#a8b0bd; pointer-events:none; }
  #pad.dragging { border-color:var(--accent); }

  /* ── agent 切换 y=784 ── */
  #agents { position:absolute; left:14px; top:784px; width:361px; height:44px; }
  #agents button { position:absolute; top:0; width:115px; height:44px; font-size:14px; }
  #agents button:nth-child(1) { left:0; }
  #agents button:nth-child(2) { left:123px; }
  #agents button:nth-child(3) { left:245px; }

  /* ── 长按 3 秒弹出的自定义按键子菜单 ── */
  #menu { position:absolute; z-index:20; display:none; padding:8px; gap:6px;
    grid-template-columns:repeat(4, 78px); background:var(--card); border:1px solid var(--accent);
    border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.7); }
  #menu.open { display:grid; }
  #menu button { height:40px; font-size:14px; }
  #menuTip { grid-column:1 / -1; font-size:10px; color:var(--dim); text-align:center; }

  /* ── 顶部提示条 ── */
  /* 提示条：固定贴屏幕顶边，在舞台之外。
     它可以被灵动岛/时间挡一点（偶发、可接受），但绝不能压住输入框——
     放在舞台里的话，舞台一被安全区下移，它就正好骑到输入框上。 */
  #toast { position:fixed; left:0; right:0; top:0; z-index:40;
    background:var(--danger); color:#fff; padding:7px 14px 8px;
    border-radius:0 0 12px 12px; font-size:12px; line-height:1.35;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
    transform:translateY(-100%); opacity:0; pointer-events:none;
    transition:transform .22s, opacity .22s; word-break:break-all; }
  #toast.show { transform:translateY(0); opacity:1; }
  #toast.ok { background:var(--ok); }
</style>
</head>
<body>
<div id="toast"></div>
<div id="safe">
<div id="stage">

  <div id="status">已连上 mini</div>
  <button id="ping">测试连接</button>
  <textarea id="ta" placeholder="在这里语音输入 / 打字，点「发送」打到 mini…"
    autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>

  <div id="mirror">
    <img id="scr" alt="">
    <div id="cursor"></div>
  </div>
  <div id="mag"><div id="magDot"></div></div>

  <div id="actions">
    <button id="aClear">清空</button>
    <button id="aBksp">⌫</button>
    <button id="voice" title="复读 / 结束"></button>
    <button id="aSendE" class="pri">发送 ↵</button>
    <button id="aSend" class="pri">换行</button>
  </div>

  <div id="cmdrow"></div>
  <div id="pad"><div class="dots"></div><div id="padHint"></div></div>

  <div id="agents">
    <button data-target="dsh">大聪明</button>
    <button data-target="hermes">小聪明</button>
    <button data-target="dsbot">大管家</button>
  </div>

  <div id="menu"></div>
</div>
</div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   phone-remote v3 · 前端
   设计基准：390×848，坐标即 CSS px（见项目 README 第四节）。
   三条铁律（改代码时别破坏）：
     1) 镜像给整块屏，不挑内容；
     2) 键盘 / 触控区 / 子菜单是「同一块地皮换班」，谁也不挤压谁；
     3) 语音键属于动作行，不许做成脱离界面的悬浮窗。
   ══════════════════════════════════════════════════════════════════════ */

const T = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
const stage = $('stage'), ta = $('ta'), toastEl = $('toast');
const statusEl = $('status'), scr = $('scr'), cursor = $('cursor'), mag = $('mag');
const pad = $('pad'), menu = $('menu'), voice = $('voice'), padHint = $('padHint');
const agentsEl = $('agents');

/* 1:1 镜像坐标系：镜像区 364×236 对应 Mac 逻辑分辨率 1512×982 */
const SW = 1512, SH = 982;
const MW = 364, MH = 236;
const KX = SW / MW;            // 镜像 1px = 屏幕多少 px

/* ── 缩放：390×848 画布等比塞进视口 ──────────────────────────────── */
/* 铺满策略（老大 02:40 反馈：手机两侧有黑边）
   原来按 min(宽,高) 等比缩放，Safari 工具栏占掉高度后整页缩到 ~0.88，两侧露出黑边。
   改成：**宽度铺满**（缩放 = 视口宽/390），高度不够时由触控区吸收 ——
   触控区本来就是"键盘那块地皮"，伸缩它不影响任何固定模块。
   舞台高度 stageH = 可用高度 / 缩放比，换算回设计坐标；agent 行贴底，触控区填中间。 */
let fitH = 0;
const AGENTS_H = 44, AGENTS_BOTTOM = 0;   // agent 按钮高 44，贴死底边
/* 第一步：把 agent 行单独再往下探 45px（= 自定义按键那排的行高），
   触控区同步长高 45px。用 ?ag=<px> 可以现场改，改成 0 就回到原位。 */
/* 实测结论：主屏模式下 iOS 交给网页的画布高度就是 812（物理屏 874），
   超出视口的内容不会渲染 —— 所以 「把内容往下推」这条路走不通，
   默认 0：agent 行贴住视口底边（812）。?ag=<px> 仍可现场试。 */
const PAGE_EXTEND = (() => {
  const v = new URLSearchParams(location.search).get('ag');
  return v === null ? 0 : Math.max(0, Math.min(120, Number(v) || 0));
})();
const TOP_GAP = 0;    // 紧贴状态栏底边（老大反馈之前移多了）
function fit() {
  const safeEl = $('safe');
  const cs = getComputedStyle(safeEl);
  let padT = parseFloat(cs.paddingTop) || 0;       // 刘海 / 灵动岛 / 状态栏
  let padB = 0;     // 不再为 Home 指示条让位：agent 行要贴死底边（老大要求）

  /* 机型安全区表（CSS pt）。env() 在部分 standalone 场景会被算成 0，
     那就按屏幕尺寸查表兜底 —— 不再靠猜。
     iPhone 16 Pro：402×874，1206×2622 物理像素 @3x，状态栏/灵动岛 62pt，Home 条 34pt。 */
  const PROFILES = [
    { w: 402, h: 874, sat: 62, sab: 34 },  // iPhone 16 Pro
    { w: 440, h: 956, sat: 62, sab: 34 },  // iPhone 16 Pro Max
    { w: 402, h: 874, sat: 62, sab: 34 },  // iPhone 16
    { w: 393, h: 852, sat: 59, sab: 34 },  // iPhone 15 / 15 Pro
    { w: 430, h: 932, sat: 59, sab: 34 },  // iPhone 15 Pro Max
    { w: 390, h: 844, sat: 47, sab: 34 },  // iPhone 14 / 13 / 12
    { w: 375, h: 812, sat: 44, sab: 34 },  // iPhone X / XS / 11 Pro
  ];
  const scrW0 = (window.screen && window.screen.width) || 0;
  const scrH0 = (window.screen && window.screen.height) || 0;
  const prof = PROFILES.find((q) => Math.abs(q.w - scrW0) <= 2 && Math.abs(q.h - scrH0) <= 2) || null;
  const standAlone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  /* 主屏模式下的顶部基准。
     真机实测（iPhone 16 Pro / iOS 26.5 / standalone）：
       env(safe-area-inset-top) = 62
     62 是「状态栏区域总高」，含灵动岛下方的一段留白；老大要的是
     **贴着电池/时间图标的底边**，且要再上移一个输入框↔镜像框的间隙(8pt)，
     所以上提 22pt → 40。
     只在主屏模式做这件事：Safari 里状态栏在视口之外，env(sat) 本来就是 0，
     再补安全区只会把整页无辜下推。 */
  const STATUS_ICON_LIFT = 22;   // 62 - 22 = 40：再上移一个「输入框↔镜像框」的间隙(8)
  let satSrc = 'env';
  if (standAlone) {
    if (padT < 20) {
      if (prof) { padT = prof.sat; satSrc = 'profile'; }
      else { padT = 59; satSrc = 'default59'; }
    }
    padT = Math.max(0, padT - STATUS_ICON_LIFT);   // 上提到图标底边
    satSrc += '-lift' + STATUS_ICON_LIFT;
  } else {
    padT = 0;                                      // 浏览器模式：视口已在状态栏之下
    satSrc = 'browser';
  }

  // 手动微调入口：?pd=59   （老大的机型若还差一点，直接在 URL 上给数字即可）
  const pd = Number(new URLSearchParams(location.search).get('pd') || 0);
  if (pd > 0) padT = pd;

  /* 视口宽度：主屏（standalone）下系统有时会把「布局视口」报成 980（桌面宽度），
     照它算缩放会得到 980/390 = 2.5 → 整页被放大 1.6 倍并溢出屏幕。
     这里用三路取值并取小，再用屏幕物理宽度兜一道底。 */
  const vv = window.visualViewport;
  const scrW = (window.screen && window.screen.width) || 0;
  const scrH = (window.screen && window.screen.height) || 0;
  let vw = Math.min(
    safeEl.clientWidth || 1e9,
    document.documentElement.clientWidth || 1e9,
    window.innerWidth || 1e9,
    vv ? vv.width : 1e9,
  );
  const standAloneNow = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (scrW && vw > scrW * 1.15) vw = scrW;             // 报成 980 时纠回屏幕宽
  if (standAloneNow && scrW && vw > scrW * 1.05) vw = scrW;
  if (!vw || vw > 2000) vw = scrW || 390;

  /* 高度取「布局视口」而不是 innerHeight/visualViewport。
     真机实测：主屏模式 innerHeight = 812，但布局视口是 874（整块屏幕）。
     用 812 会把页面停在离物理底边 62px 处，agent 行就贴不到底。
     也别用 min：键盘弹起时 innerHeight 会缩小，那一缩整页就会矮一截——
     而我们要的正是「键盘盖住触控区、页面不动」。 */
  let vhCss = Math.max(
    safeEl.clientHeight || 0,
    document.documentElement.clientHeight || 0,
  );
  if (!vhCss) vhCss = window.innerHeight || 844;
  if (scrH && vhCss > scrH * 1.15) vhCss = scrH;
  if (!vhCss || vhCss > 2000) vhCss = scrH || 844;

  const vh = Math.max(vhCss - padT - padB - TOP_GAP, 600) + PAGE_EXTEND; // 键盘弹起时不压扁

  let s = Math.min(vw / 390, 1.6);                  // 只按宽度缩放，左右零黑边
  if (390 * s > vw + 1) s = vw / 390;               // 硬约束：绝不横向溢出
  const stageH = vh / s;

  stage.style.transform = `scale(${s})`;           // 绝对定位以 padding box 为基准，padding 不会推开它 → 显式下移
  stage.style.top = (padT + TOP_GAP) + 'px';
  stage.style.height = stageH + 'px';

  const agentsTop = stageH - AGENTS_H - AGENTS_BOTTOM;
  agentsEl.style.top = agentsTop + 'px';
  pad.style.height = Math.max(120, agentsTop - 8 - 466) + 'px';   // 466 = 触控区上沿
  window.__fitInfo = { vw: Math.round(vw), vh: Math.round(vh), s: +s.toFixed(3), stageH: Math.round(stageH), padT, satSrc, prof: prof ? (prof.w + 'x' + prof.h) : null };
  fitH = window.innerHeight;
}
fit();
window.addEventListener('orientationchange', () => setTimeout(fit, 260));
/* 键盘弹起时 innerHeight 会变小：不要重排（否则整页跳），保持顶部锚定即可 */
window.addEventListener('resize', () => {
  if (Math.abs(window.innerHeight - fitH) > 150) return;
  fit();
});
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => window.scrollTo(0, 0));

/* ── 提示 / 震动 / 请求 ───────────────────────────────────────────── */
let toastTimer;
function flash(msg, ok) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('ok', !!ok);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ok ? 1600 : 3500);
}
const vibe = (ms = 8) => { if (navigator.vibrate) navigator.vibrate(ms); };

async function post(path, body) {
  if (!T) { flash('缺 token：请用带 ?t=… 的完整地址打开'); return null; }
  try {
    const r = await fetch(path + '?t=' + encodeURIComponent(T), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    if (!r.ok) { setStatus(true); flash('mini 返回错误：' + (await r.text())); return null; }
    setStatus(true);                       // 收到回包 = 连得上
    return await r.json().catch(() => ({}));
  } catch (e) { setStatus(false); flash('连不上 mini：' + e.message); return null; }
}

/* ── 连接状态 ─────────────────────────────────────────────────────── */
/* 状态栏：真实状态，不是静态文字。
   来源三处：① 每 15 秒探一次 /health；② 任何一次请求成功/失败都会即时更新；③ 点「测试连接」立刻复测。 */
function setStatus(ok, text) {
  statusEl.textContent = text || (ok ? '已连上 mini' : '连不上 mini');
  statusEl.className = ok ? 'ok' : 'err';
}
async function ping() {

}
setInterval(() => { if (!document.hidden) ping(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) ping(); });
$('ping').addEventListener('click', () => { vibe(); ping().then(() => flash('已连上 mini ✓', true)); });

/* ── 动作行 ───────────────────────────────────────────────────────── */
async function sendText(withEnter) {
  const v = ta.value;

  ta.value = ''; ta.focus();
  // 回包里的 armed 就是"这条已被记为手机发起"——直接给用户看，不用查日志
  if (r && r.armed) { voice.classList.add('armed'); flash('已发出 · 这条回复的语音走手机', true); }
}
$('aSend').addEventListener('click', () => sendText(false));

/* 语音红点：复读 / 结束，语义同 Mac 上那个声波键。
   P4 接 /say 之前，状态机先立好：没有可复读的音频时红点不亮。 */
/* 语音回读（P4）：
   服务端监听 DSH 转写，一轮结束时合成 mp3；手机发起的对话把音频放进"待播队列"。
   这里轮询队列 → 自动播放；红点 = 复读 / 播放中再点 = 打断。
   iOS 不允许无手势自动播放：页面首次触摸时做一次静音解锁。 */
let audio = null, lastAudioUrl = null, playing = false, lastSpeechId = null, audioUnlocked = false;
const SILENT = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

function paintVoice() {
  voice.classList.toggle('ready', !!lastAudioUrl);
  voice.classList.toggle('playing', playing);
}
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    const a = new Audio(SILENT);
    a.volume = 0;
    a.play().then(() => { a.pause(); }).catch(() => {});
  } catch (e) {}
  post('/warm', {});          // 顺手预热 GENIE，首句不用等 27 秒
}
document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
document.addEventListener('click', unlockAudio, { once: true });

function playSpeech() {
  if (!lastAudioUrl) return;
  if (audio) { try { audio.pause(); } catch (e) {} }
  audio = new Audio(lastAudioUrl);
  audio.onended = () => {
    playing = false; paintVoice();
    post('/say/ack', {});                    // 这一段播完，让服务端推进下一段
  };
  audio.onerror = () => { playing = false; paintVoice(); flash('语音取不到（看看 mini 端是否在跑）'); };
  audio.play()
    .then(() => { playing = true; paintVoice(); })
    .catch(() => { playing = false; paintVoice(); flash('iOS 拦了自动播放：点一下红点即可'); });
}

async function pollSpeech() {
  if (T) {
    try {
      const r = await fetch('/say/pending?t=' + encodeURIComponent(T), { cache: 'no-store' });
      if (r.ok) {
        const d = await r.json();
        if (d.id && d.id !== lastSpeechId) {
          lastSpeechId = d.id;
          lastAudioUrl = '/say/audio?t=' + encodeURIComponent(T) + '&id=' + d.id;
          voice.classList.remove('armed');
          paintVoice();
          playSpeech();                       // 自动念
        }
      }
    } catch (e) {}
  }
  setTimeout(pollSpeech, 1200);
}

voice.addEventListener('click', () => {
  vibe();
  if (playing) {
    if (audio) { try { audio.pause(); } catch (e) {} }
    playing = false; paintVoice();
    post('/say/stop', {});                    // 同时掐掉 Mac 侧可能在放的
    return;
  }
  if (!lastAudioUrl) { flash('还没有可复读的语音'); return; }
  playSpeech();
});
paintVoice();
/* 页面刚打开/刷新后，红点也要能复读上一句（只取 id，不自动播） */
if (T) {
  fetch('/say/last?t=' + encodeURIComponent(T), { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      if (d && d.id) {
        lastSpeechId = d.id;
        lastAudioUrl = '/say/audio?t=' + encodeURIComponent(T) + '&id=' + d.id;
        paintVoice();
      }
    })
    .catch(() => {});
}
pollSpeech();

/* ── ⌘ 一排：默认 ⌘C/V/Z/A；任一键长按 3 秒 → 同一份子菜单，自由组合 ── */
const CMD_DEFAULT = [
  { label: '⌘C', action: 'cmd-c' }, { label: '⌘V', action: 'cmd-v' },
  { label: '⌘Z', action: 'cmd-z' }, { label: '⌘A', action: 'cmd-a' },
];
const MENU_KEYS = [
  { label: '↑', action: 'up' }, { label: '↓', action: 'down' },
  { label: '←', action: 'left' }, { label: '→', action: 'right' },
  { label: 'Tab', action: 'tab' }, { label: 'Enter', action: 'enter' },
  { label: 'Esc', action: 'esc' }, { label: '⌫', action: 'backspace' },
  { label: '^C', action: 'ctrl-c' }, { label: '^D', action: 'ctrl-d' },
  { label: '^R', action: 'ctrl-r' }, { label: '^L', action: 'ctrl-l' },
  { label: '^U', action: 'ctrl-u' }, { label: '⌘S', action: 'cmd-s' },
  { label: '⌘F', action: 'cmd-f' }, { label: '⌘W', action: 'cmd-w' },
  { label: '⌘T', action: 'cmd-t' }, { label: '⌘Tab', action: 'cmd-tab' },
];
const LS_KEY = 'pm.cmdrow.v3';
let cmdSlots = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (Array.isArray(v) && v.length === 4) return v;
  } catch (e) {}
  return JSON.parse(JSON.stringify(CMD_DEFAULT));
})();
const saveSlots = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(cmdSlots)); } catch (e) {} };

const cmdButtons = [];
function buildCmdRow() {
  const row = $('cmdrow');
  row.innerHTML = '';
  cmdButtons.length = 0;
  cmdSlots.forEach((slot, i) => {
    const b = document.createElement('button');
    b.textContent = slot.label;
    b.dataset.i = i;
    bindCmdKey(b, i);
    row.appendChild(b);
    cmdButtons.push(b);
  });
}

let holdTimer = null, held = false;
function bindCmdKey(btn, i) {
  const start = () => {
    held = false;
    btn.classList.add('holding');
    holdTimer = setTimeout(() => {
      held = true;                        // 3 秒到：展开子菜单，不触发按键
      vibe(20); openMenu(i);
      btn.classList.remove('holding');
    }, 3000);
  };
  const cancel = () => { clearTimeout(holdTimer); btn.classList.remove('holding'); };
  btn.addEventListener('touchstart', start, { passive: true });
  btn.addEventListener('touchend', (e) => {
    cancel(); e.preventDefault();
    if (held) { held = false; return; }
    vibe(); post('/key', { action: cmdSlots[i].action });
  });
  btn.addEventListener('touchcancel', cancel);
  // 桌面浏览器调试用
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', () => {
    cancel();
    if (held) { held = false; return; }
    post('/key', { action: cmdSlots[i].action });
  });
}

let menuSlot = -1;
function openMenu(i) {
  menuSlot = i;
  menu.innerHTML = '';
  MENU_KEYS.forEach((k) => {
    const b = document.createElement('button');
    b.textContent = k.label;
    b.addEventListener('click', () => {
      cmdSlots[i] = { label: k.label, action: k.action };
      saveSlots(); buildCmdRow(); closeMenu();
      vibe(12); flash('第 ' + (i + 1) + ' 个键改成「' + k.label + '」', true);
    });
    menu.appendChild(b);
  });
  const tip = document.createElement('div');
  tip.id = 'menuTip';
  tip.textContent = '选一个替换第 ' + (i + 1) + ' 个键（点空白处取消）';
  menu.appendChild(tip);

  const r = cmdButtons[i].getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const scale = sr.width / 390;
  menu.classList.add('open');
  const mw = menu.offsetWidth || (4 * 78 + 30);
  let left = (r.left - sr.left) / scale - (mw - 85) / 2;
  left = Math.max(8, Math.min(390 - mw - 8, left));
  menu.style.left = left + 'px';
  menu.style.top = ((r.bottom - sr.top) / scale + 8) + 'px';
}
function closeMenu() { menu.classList.remove('open'); menuSlot = -1; }
document.addEventListener('touchstart', (e) => {
  if (menu.classList.contains('open') && !menu.contains(e.target)) closeMenu();
}, { passive: true });
document.addEventListener('mousedown', (e) => {
  if (menu.classList.contains('open') && !menu.contains(e.target)) closeMenu();
});

/* ── 屏幕镜像：200ms 一帧（5fps）；本地光标 60fps 跟手 ────────────── */
/* 帧率：300ms（≈3.3fps）。原来 200ms 时实测把 WindowServer 拉到 48%、GPU 18%——
   每帧都要 screenshot + sips 各 fork 一次，还要逼系统做一次全屏合成。
   页面在后台（document.hidden）时一律不抓。 */
const FRAME_MS = 300;
let frameBusy = false;
let lastFrameAt = 0, frameFails = 0;
function tick() {
  if (frameBusy || !T || document.hidden) return;   // 后台一律不抓，别空耗 CPU
  frameBusy = true;
  const im = new Image();
  im.onload = () => { scr.src = im.src; frameBusy = false; lastFrameAt = Date.now(); frameFails = 0; scr.classList.remove('dead'); $('mirror').classList.remove('dead'); };
  im.onerror = () => {
    frameBusy = false; frameFails++;
    if (frameFails >= 5) { scr.classList.add('dead'); $('mirror').classList.add('dead'); }   // 连续失败：画面上给个字
  };
  im.src = '/screen?t=' + encodeURIComponent(T) + '&width=728&_=' + Date.now();
}
setInterval(tick, FRAME_MS);
tick();

/* ── 触控区：MacBook 触控板手势 ──────────────────────────────────── */
const cur = { x: SW / 2, y: SH / 2 };      // 本地光标（屏幕坐标）
let pendX = 0, pendY = 0, flushAt = 0, dragAt = 0;

function renderCursor(show) {
  cursor.style.left = (cur.x / SW) * MW + 'px';
  cursor.style.top = (cur.y / SH) * MH + 'px';
  cursor.classList.toggle('show', !!show);
}
function flushMove(force) {
  if (!pendX && !pendY) return;
  const t = performance.now();
  if (!force && t < flushAt) return;
  flushAt = t + 30;                        // 节流 30ms：cliclick 每次 fork 一个进程
  const dx = Math.round(pendX), dy = Math.round(pendY);
  pendX -= dx; pendY -= dy;
  if (dx || dy) post('/mouse', { type: 'move', dx, dy });
}
function sendMove(sx, sy) {
  cur.x = Math.max(0, Math.min(SW, cur.x + sx));
  cur.y = Math.max(0, Math.min(SH, cur.y + sy));
  pendX += sx; pendY += sy;
  renderCursor(true);
  if (mode === 'drag') {
    // 拖动中：用 cliclick 的 dm（继续拖拽到指定坐标），窗口才会跟手移动
    if (performance.now() >= dragAt) {
      dragAt = performance.now() + 40;
      post('/mouse', { type: 'dragMove', x: Math.round(cur.x), y: Math.round(cur.y) });
    }
  } else {
    flushMove(false);
  }
  scheduleMag();
}
/* 放大镜（矩形临时面板）：
   - 位置固定：正好盖住「动作行 + ⌘行」两行，不覆盖触控区
   - 内容：以指针为中心取一条横幅（430×108 逻辑点）塞进 364×91 里 → 相对镜像放大约 3.4 倍
   - 只在触摸期间显示，抬手立即消失；取样节流 150ms */
const MAG_W = 364, MAG_H = 91;         // 面板 CSS 尺寸
const MAG_CW = 430;                     // 取样宽（逻辑点）
const MAG_CH = Math.round(MAG_CW * MAG_H / MAG_W);   // 保持面板比例 → 约 108
let magShown = false, magBusy = false, magAt = 0, magHideTimer = null;
let syncing = false;

function showMag() {
  magShown = true;
  mag.style.display = 'block';
  updateMag();
}
function hideMag() {
  magShown = false;
  mag.style.display = 'none';
}
function updateMag() {
  if (!magShown || magBusy || !T) return;
  if (performance.now() < magAt) return;
  magAt = performance.now() + 150;
  const x = Math.max(0, Math.min(SW - MAG_CW, Math.round(cur.x - MAG_CW / 2)));
  const y = Math.max(0, Math.min(SH - MAG_CH, Math.round(cur.y - MAG_CH / 2)));
  magBusy = true;
  const im = new Image();
  im.onload = () => {
    mag.style.backgroundImage = 'url(' + im.src + ')';
    // 指针在取样框里的相对位置（0..1）；贴边取样时框会偏移，小黄点也跟着偏
    const fx = MAG_CW ? (cur.x - x) / MAG_CW : 0.5;
    const fy = MAG_CH ? (cur.y - y) / MAG_CH : 0.5;
    const dot = document.getElementById('magDot');
    if (dot) {
      dot.style.display = 'block';
      dot.style.left = Math.max(0, Math.min(1, fx)) * MAG_W + 'px';
      dot.style.top = Math.max(0, Math.min(1, fy)) * MAG_H + 'px';
    }
    magBusy = false;
  };
  im.onerror = () => { magBusy = false; };
  im.src = '/screen?t=' + encodeURIComponent(T) + '&x=' + x + '&y=' + y + '&rw=' + MAG_CW + '&rh=' + MAG_CH + '&_=' + Date.now();
}
function scheduleMag() { if (magShown) updateMag(); }

let touches = [], mode = null, lastPt = null;
let tStart = 0, startPt = null, moved = 0, longPressTimer = null;
let scrollAcc = 0, pinchBase = 0, firedPinch = false, swipeFired = false;
let lastTap = 0, tapTimer = null;

const nowMs = () => performance.now();
const distP = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
const midY = () => (touches[0].clientY + touches[1].clientY) / 2;

function beginDrag() { mode = 'drag'; pad.classList.add('dragging'); post('/mouse', { type: 'down' }); }
function endDrag() { if (mode === 'drag') post('/mouse', { type: 'up', x: Math.round(cur.x), y: Math.round(cur.y) }); pad.classList.remove('dragging'); }

pad.addEventListener('touchstart', (e) => {
  touches = Array.from(e.touches);
  clearTimeout(magHideTimer); showMag();          // 按下出现矩形放大面板
  // 关键：先把本地光标对齐到 Mac 上的真实指针位置，
  // 否则本地光标从"屏幕中心"起算，点击位置永远和他看到的位置有偏移。
  if (!syncing) {
    syncing = true;
    fetch('/mouse/pos?t=' + encodeURIComponent(T), { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (d && Number.isFinite(d.x)) { cur.x = d.x; cur.y = d.y; renderCursor(true); } })
      .catch(() => {})
      .then(() => { syncing = false; });
  }
  if (touches.length === 1) {
    mode = 'point';
    startPt = { x: touches[0].clientX, y: touches[0].clientY };
    lastPt = startPt; tStart = nowMs(); moved = 0;
    clearTimeout(longPressTimer);
    // 长按 400ms 且没怎么动 → 按住左键开始拖拽（拖窗口、选文本）
    longPressTimer = setTimeout(() => { if (mode === 'point' && moved < 10) beginDrag(); }, 520);
  } else if (touches.length === 2) {
    clearTimeout(longPressTimer);
    mode = 'scroll';
    lastPt = { x: 0, y: midY() };
    scrollAcc = 0; pinchBase = distP(touches[0], touches[1]); firedPinch = false;
  } else {
    clearTimeout(longPressTimer);
    mode = 'swipe';
    swipeFired = false;
    startPt = { x: touches[0].clientX, y: touches[0].clientY };
    lastPt = { x: startPt.x, y: startPt.y };      // 三/四指也要记起点，否则 touchmove 会早退
  }
  e.preventDefault();
}, { passive: false });

pad.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const ts = Array.from(e.touches);
  if (!ts.length) return;
  touches = ts;                       // 记下最新坐标：touchend 靠它算滑动方向
  if (!lastPt) lastPt = { x: ts[0].clientX, y: ts[0].clientY };

  if (ts.length >= 3 && mode === 'swipe' && !swipeFired) {
    // 三/四指：一旦越过阈值当场触发，不等抬手 —— 抬手时机不稳定，之前就是"有时灵有时不灵"
    const dx = ts[0].clientX - startPt.x, dy = ts[0].clientY - startPt.y;
    const TH = 22;
    if (Math.abs(dx) > TH || Math.abs(dy) > TH) {
      const horiz = Math.abs(dx) > Math.abs(dy);
      // 跟 MacBook 触控板的手感对齐：手指往右滑 = 画面往右推 = 切到**左边**的桌面
      // （原来写反了：往右滑却切到右边，和习惯相反）
      const action = horiz ? (dx > 0 ? 'ctrl-left' : 'ctrl-right') : (dy < 0 ? 'ctrl-up' : 'ctrl-down');
      post('/key', { action }); vibe(12); swipeFired = true;
    }
  }
  if (ts.length === 1 && (mode === 'point' || mode === 'drag')) {
    const p = ts[0];
    const dx = p.clientX - lastPt.x, dy = p.clientY - lastPt.y;
    lastPt = { x: p.clientX, y: p.clientY };
    moved += Math.hypot(dx, dy);
    if (mode === 'point' && moved > 10) clearTimeout(longPressTimer);
    const v = Math.hypot(dx, dy) / 16;                 // 粗略速度
    const acc = Math.min(3, 0.55 + v * 0.9);           // 加速度：动得快 → 跑得远
    sendMove(dx * KX * acc, dy * KX * acc);
  } else if (ts.length === 2 && mode === 'scroll') {
    const y = (ts[0].clientY + ts[1].clientY) / 2;
    scrollAcc += y - lastPt.y;
    lastPt = { x: 0, y };
    if (Math.abs(scrollAcc) >= 60) {                   // 每 60 逻辑px 翻一页
      post('/mouse', { type: 'scroll', dy: scrollAcc > 0 ? 120 : -120 });
      scrollAcc = 0;
    }
    const fd = distP(ts[0], ts[1]);
    if (!firedPinch && pinchBase && Math.abs(fd - pinchBase) > 34) {
      firedPinch = true;
      post('/key', { action: fd > pinchBase ? 'cmd-plus' : 'cmd-minus' });
      vibe();
    }
  }
}, { passive: false });

pad.addEventListener('touchend', (e) => {
  e.preventDefault();
  const dt = nowMs() - tStart;
  const left = e.touches.length;

  if (mode === 'scroll' && left === 0 && dt < 260 && moved < 12) {
    post('/mouse', { type: 'rightclick' }); vibe();       // 双指轻点 = 右键
  } else if (mode === 'point' && left === 0) {
    if (dt < 420 && moved < 12) {   // 420ms 内、位移小 → 算轻点（原来 260ms，正常按压常被判掉）
      // 轻点 = 单击；320ms 内再点 → 双击（打开文件要用）
      const t = nowMs();
      if (t - lastTap < 380) {
        clearTimeout(tapTimer);
        post('/mouse', { type: 'doubleclick' }); vibe(12); lastTap = 0;
      } else {
        lastTap = t;
        tapTimer = setTimeout(() => { post('/mouse', { type: 'click' }); vibe(); lastTap = 0; }, 200);
      }
    }
    endDrag();
  } else if (mode === 'swipe' && left === 0) {
    if (swipeFired) { mode = null; return; }
    /* 三指 / 四指：按主方向发快捷键，和 MacBook 触控板一致
         上滑 → 调度中心 (Ctrl+↑)      下滑 → App Exposé (Ctrl+↓)
         左/右 → 切换全屏应用 / 桌面 (Ctrl+← / Ctrl+→) */
    const p = touches[0] || startPt;
    const dx = p.clientX - startPt.x, dy = p.clientY - startPt.y;
    const n = touches.length;
    if (n >= 3) {
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx < -40) { post('/key', { action: 'ctrl-left' }); vibe(); }
        else if (dx > 40) { post('/key', { action: 'ctrl-right' }); vibe(); }
      } else {
        if (dy < -40) { post('/key', { action: 'ctrl-up' }); vibe(); }
        else if (dy > 40) { post('/key', { action: 'ctrl-down' }); vibe(); }
      }
    }
    mode = null;
  } else if (left === 0) {
    endDrag();
  }

  if (left === 0) {
    clearTimeout(longPressTimer);
    setTimeout(() => { touches = []; mode = null; flushMove(true); }, 0);
    clearTimeout(magHideTimer);
    magHideTimer = setTimeout(() => { flushMove(true); hideMag(); }, 120);   // 抬手 120ms 后收起
  }
}, { passive: false });

pad.addEventListener('touchcancel', () => {
  endDrag(); clearTimeout(longPressTimer); touches = []; mode = null;
});

/* ── 启动 ─────────────────────────────────────────────────────────── */
buildCmdRow();
renderCursor(false);
ping();
if (new URLSearchParams(location.search).get('dbg')) {
  const d = document.createElement('div');
  d.id = 'dbg';
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(0,0,0,.88);' +
    'color:#3ddc84;font:11px/1.5 ui-monospace,Menlo,monospace;padding:6px 8px;white-space:pre-wrap;';
  document.body.appendChild(d);
  const paint = () => {
    const i = window.__fitInfo || {};
    d.textContent = [
      'screen ' + (window.screen ? screen.width + 'x' + screen.height : '?') + ' dpr' + devicePixelRatio,
      'inner ' + innerWidth + 'x' + innerHeight + '  vv ' +
        (window.visualViewport ? Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) : '?'),
      'standalone ' + ((window.navigator.standalone === true) ||
        (window.matchMedia && matchMedia('(display-mode: standalone)').matches)),
      'env(sat) ' + getComputedStyle($('safe')).paddingTop + '  ->  padT ' + i.padT + ' (' + i.satSrc + ')',
      'scale ' + i.s + '  stageH ' + i.stageH + '  vw ' + i.vw + '  vh ' + i.vh,
      'profile ' + (i.prof || 'none') + '  extend ' + PAGE_EXTEND,
    ].join('\n');
  };
  paint();
  setInterval(() => { fit(); paint(); }, 1500);
}
padHint.textContent = '单指移·轻点=左键·双指轻点=右键·双指滑=滚动·三指/四指滑=切桌面·长按拖=拖拽';
if (!T) flash('缺 token：请用带 ?t=… 的完整地址打开');
</script>
